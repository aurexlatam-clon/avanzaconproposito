<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lime Company — No empieces de cero</title>
<style>
  @font-face {
    font-family: 'Archivo Black';
    src: local('Archivo Black');
  }
  :root{
    --bg: #08090a;
    --bg-card: #131513;
    --bg-field: #1a1c1a;
    --line: #2a2d2a;
    --green: #c6ff2f;
    --green-dim: #93c422;
    --white: #f4f4f2;
    --mute: #8a8f88;
    --danger: #ff5a4d;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Manrope','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--green);color:#0a0a0a;}

  .page{
    max-width:520px;
    margin:0 auto;
    position:relative;
  }

  /* ---------- HERO IMAGE ---------- */
  .hero-shot{
    width:100%;
    display:block;
  }

  /* ---------- FORM SECTION ---------- */
  .unlock-section{
    padding:40px 22px 48px;
    text-align:center;
    position:relative;
  }
  .unlock-eyebrow{
    font-family:'Archivo Black','Arial Black',sans-serif;
    letter-spacing:0.14em;
    font-size:12px;
    color:var(--green);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .lock-wrap{
    width:74px;
    height:74px;
    margin:0 auto 22px;
    position:relative;
  }
  .lock-wrap svg{ width:100%; height:100%; overflow:visible; }
  .lock-shackle{
    transform-origin:37px 30px;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1);
  }
  .lock-wrap.open .lock-shackle{
    transform: translateY(-8px) rotate(-28deg);
  }
  .lock-body{ transition: fill .3s ease; }
  .lock-wrap.open .lock-body{ fill:var(--green); }
  .lock-wrap.open .lock-glow{ opacity:1; }
  .lock-glow{
    position:absolute;
    inset:-18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(198,255,47,0.35), transparent 70%);
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
  }

  .unlock-title{
    font-family:'Archivo Black','Arial Black',sans-serif;
    font-size:26px;
    line-height:1.15;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .unlock-title span{ color:var(--green); }
  .unlock-sub{
    color:var(--mute);
    font-size:15px;
    line-height:1.5;
    margin-bottom:28px;
  }

  .field{
    text-align:left;
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--mute);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    background:var(--bg-field);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    color:var(--white);
    font-size:15px;
    font-family:inherit;
    transition:border-color .2s ease, background .2s ease;
  }
  .field input::placeholder{ color:#5a5f58; }
  .field input:focus{
    outline:none;
    border-color:var(--green);
    background:#1c1f1c;
  }
  .field input:invalid:not(:placeholder-shown){
    border-color:var(--danger);
  }

  .unlock-btn{
    width:100%;
    margin-top:10px;
    padding:17px 20px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:#0a0a0a;
    font-family:'Archivo Black','Arial Black',sans-serif;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform .15s ease, background .3s ease, opacity .3s ease;
    position:relative;
    overflow:hidden;
  }
  .unlock-btn:hover{ transform:translateY(-2px); }
  .unlock-btn:active{ transform:translateY(0); }
  .unlock-btn.done{
    background:#1c1f1c;
    color:var(--green);
    border:1px solid var(--green);
  }
  .unlock-note{
    margin-top:14px;
    font-size:12px;
    color:#5a5f58;
  }

  /* ---------- TEASER (visible before unlock) ---------- */
  .locked-teaser{
    margin:0 22px 40px;
    padding:24px 20px;
    border:1px dashed var(--line);
    border-radius:14px;
    text-align:center;
    transition:opacity .4s ease, max-height .4s ease;
  }
  .locked-teaser.hide{
    opacity:0;
    max-height:0;
    padding:0;
    margin:0;
    overflow:hidden;
    border:none;
  }
  .locked-teaser .lt-icon{
    width:34px;height:34px;margin:0 auto 12px;
    opacity:.6;
  }
  .locked-teaser p{
    font-size:13px;
    color:var(--mute);
    line-height:1.5;
  }
  .locked-teaser strong{ color:var(--green); }

  /* ---------- CONTENT BELOW FORM (always visible, scroll freely) ---------- */
  .locked-content{
    opacity:1;
  }

  .stairs-shot, .video-desc-shot, .founder-shot, .listo-shot{
    width:100%;
    display:block;
  }

  /* ---------- VIDEO CTA ---------- */
  .video-cta-section{
    padding:38px 22px 54px;
    text-align:center;
    background:linear-gradient(180deg, #08090a 0%, #0c0e0c 100%);
  }
  .video-btn{
    width:100%;
    padding:19px 20px;
    border:none;
    border-radius:10px;
    background:var(--green);
    color:#0a0a0a;
    font-family:'Archivo Black','Arial Black',sans-serif;
    font-size:16px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 0 0 0 rgba(198,255,47,0.5);
    animation:pulse 2.4s infinite;
    transition:transform .15s ease;
  }
  .video-btn:hover{ transform:translateY(-2px); }
  .btn-lock-icon{
    width:16px;
    height:16px;
    flex-shrink:0;
  }
  .video-btn:not(.locked) .btn-lock-icon{ display:none; }
  .video-locked-note{
    margin-top:12px;
    font-size:12px;
    color:var(--danger);
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity .3s ease;
  }
  .video-locked-note.show{
    opacity:1;
    max-height:40px;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(198,255,47,0.35); }
    70%{ box-shadow:0 0 0 14px rgba(198,255,47,0); }
    100%{ box-shadow:0 0 0 0 rgba(198,255,47,0); }
  }
  .limited-tag{
    margin-top:16px;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--danger);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .limited-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--danger);
    animation:blink 1.4s infinite;
  }
  @keyframes blink{ 50%{ opacity:.25; } }

  /* ---------- VIDEO PLAYER (placeholder) ---------- */
  .video-player{
    margin:26px 0 0;
    aspect-ratio:9/16;
    max-height:70vh;
    border-radius:14px;
    border:1px solid var(--line);
    background:
      radial-gradient(circle at 50% 50%, rgba(198,255,47,0.07), transparent 60%),
      #0f110f;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--mute);
    font-size:13px;
    text-align:center;
    padding:24px;
  }
  .video-player.show{ display:flex; }
  .play-icon{
    width:58px;height:58px;border-radius:50%;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
  }
  .play-icon svg{ width:20px;height:20px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- HERO IMAGE -->
  <img class="hero-shot" src="Hero.png" alt="Hay proyectos que suenan bien. Y luego están los que funcionan.">

  <!-- FORM / UNLOCK -->
  <section class="unlock-section">
    <div class="unlock-eyebrow">Acceso privado</div>

    <div class="lock-wrap" id="lockWrap">
      <div class="lock-glow"></div>
      <svg viewBox="0 0 74 74" fill="none">
        <rect class="lock-body" x="14" y="30" width="46" height="34" rx="8" fill="#c6ff2f" fill-opacity="0.14" stroke="#c6ff2f" stroke-width="2.5"/>
        <circle cx="37" cy="47" r="4" fill="#c6ff2f"/>
        <line x1="37" y1="47" x2="37" y2="55" stroke="#c6ff2f" stroke-width="2.5" stroke-linecap="round"/>
        <path class="lock-shackle" d="M22 30V24C22 15.7157 28.7157 9 37 9C45.2843 9 52 15.7157 52 24V30" stroke="#c6ff2f" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h2 class="unlock-title">Completa tus datos<br>para <span>reservar tu acceso</span></h2>
    <p class="unlock-sub">Así podemos darte seguimiento personalizado sobre el sistema.</p>

    <form id="unlockForm">
      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" placeholder="Tu nombre completo" required>
      </div>
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" placeholder="tu@correo.com" required>
      </div>
      <div class="field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" name="telefono" type="tel" placeholder="+52 999 999 9999" required>
      </div>

      <button type="submit" class="unlock-btn" id="unlockBtn">Quiero desbloquear mi teléfono</button>
      <div class="unlock-note">Tus datos están protegidos. Cero spam.</div>
    </form>
  </section>

  <!-- Content below scrolls freely regardless of form submission -->
  <div class="locked-content" id="lockedContent">

    <img class="stairs-shot" src="empezar.png" alt="No empieces de cero. Avanza con un sistema.">

    <img class="video-desc-shot" src="4.png" alt="En este video gratuito descubrirás">

    <img class="founder-shot" src="yo.png" alt="Soy Ale Torres, empresaria, formadora y mamá de dos hijos">

    <img class="listo-shot" src="listo.png" alt="No es suerte. Es dar los pasos correctos.">

    <section class="video-cta-section">
      <a class="video-btn locked" id="videoBtn" href="lime-funnel-parte2.html">
        <svg class="btn-lock-icon" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2">
          <rect x="5" y="11" width="14" height="9" rx="2"/>
          <path d="M8 11V8a4 4 0 018 0v3"/>
        </svg>
        Quiero ver el video
      </a>
      <div class="video-locked-note" id="videoLockedNote">Completa tus datos arriba para continuar</div>
      <div class="limited-tag"><span class="limited-dot"></span>Disponible por tiempo limitado</div>
    </section>

  </div>

</div>

<script>
  const form = document.getElementById('unlockForm');
  const lockWrap = document.getElementById('lockWrap');
  const unlockBtn = document.getElementById('unlockBtn');
  const videoBtn = document.getElementById('videoBtn');
  const videoLockedNote = document.getElementById('videoLockedNote');
  let formCompleted = false;

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }

    formCompleted = true;
    lockWrap.classList.add('open');
    unlockBtn.textContent = 'Enviado ✓';
    unlockBtn.classList.add('done');
    unlockBtn.disabled = true;

    videoBtn.classList.remove('locked');
    videoLockedNote.classList.remove('show');
  });

  videoBtn.addEventListener('click', function(e){
    if(formCompleted) return; // let the link navigate normally

    e.preventDefault();
    videoLockedNote.classList.add('show');
    document.getElementById('nombre').scrollIntoView({behavior:'smooth', block:'center'});
    setTimeout(function(){ document.getElementById('nombre').focus(); }, 400);
  });
</script>

</body>
</html>
