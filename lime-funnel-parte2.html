<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El sistema que funciona</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  :root{
    --bg:#0a0a0a;
    --bg-2:#000000;
    --panel:#151515;
    --panel-2:#1c1c1c;
    --acid:#c6ff2e;
    --acid-dim:#9fd91f;
    --white:#f5f5f2;
    --grey:#9a9a94;
    --line:rgba(198,255,46,0.25);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Archivo', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:0 0 90px;
    position:relative;
  }

  /* ---------- glow atmosphere ---------- */
  .glow{
    position:absolute;
    width:480px; height:480px;
    background:radial-gradient(circle, rgba(198,255,46,0.16) 0%, rgba(198,255,46,0) 70%);
    pointer-events:none;
    z-index:0;
  }

  /* ---------- SECTION 1: Hero headline ---------- */
  .hero{
    position:relative;
    padding:76px 28px 40px;
    text-align:center;
    z-index:1;
  }
  .hero .glow{ top:-160px; left:50%; transform:translateX(-50%); }
  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:0.28em;
    color:var(--acid);
    font-weight:700;
    margin-bottom:18px;
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
  }
  h1.headline{
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:clamp(34px, 8.6vw, 46px);
    line-height:1.06;
    letter-spacing:0.005em;
  }
  h1.headline .accent{ color:var(--acid); }

  /* ---------- SECTION 2: video placeholder ---------- */
  .video-block{
    position:relative;
    z-index:1;
    margin:34px 24px 0;
  }
  .video-frame{
    position:relative;
    aspect-ratio:9/16;
    max-height:640px;
    border-radius:14px;
    border:1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(198,255,46,0.05), rgba(0,0,0,0) 40%),
      var(--panel);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .video-frame::before{
    content:'';
    position:absolute; inset:0;
    background:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:32px 32px;
    opacity:0.15;
  }
  .play-btn{
    position:relative;
    width:74px; height:74px;
    border-radius:50%;
    background:var(--acid);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(198,255,46,0.45);
  }
  .play-btn::after{
    content:'';
    width:0; height:0;
    margin-left:6px;
    border-top:14px solid transparent;
    border-bottom:14px solid transparent;
    border-left:22px solid #0a0a0a;
  }
  .video-caption{
    text-align:center;
    font-size:13px;
    color:var(--grey);
    margin-top:12px;
    letter-spacing:0.02em;
  }

  /* ---------- CTA button (shared style) ---------- */
  .cta-wrap{
    padding:0 24px;
    margin-top:28px;
    position:relative;
    z-index:1;
  }
  .cta-btn{
    display:block;
    width:100%;
    background:var(--acid);
    color:#0a0a0a;
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:17px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    text-align:center;
    padding:19px 20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 0 30px rgba(198,255,46,0.28);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .cta-btn:hover{ transform:translateY(-2px); box-shadow:0 0 40px rgba(198,255,46,0.45); }

  /* ---------- SECTION: call notice text ---------- */
  .call-note{
    max-width:460px;
    margin:22px auto 0;
    padding:0 32px;
    text-align:center;
    font-size:14px;
    line-height:1.55;
    color:var(--grey);
    position:relative;
    z-index:1;
  }
  .call-note b{ color:var(--white); font-weight:700; }

  /* ---------- divider ---------- */
  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:56px 28px 0;
    position:relative;
    z-index:1;
  }
  .divider span{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .divider .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--acid);
    box-shadow:0 0 10px rgba(198,255,46,0.7);
    flex:none;
  }

  /* ---------- SECTION 3: checklist image ---------- */
  .checklist-block{
    position:relative;
    margin:40px 20px 0;
    z-index:1;
  }
  .img-frame{
    width:100%;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--line);
    display:block;
  }
  .img-frame img{
    width:100%;
    display:block;
  }

  /* ---------- SECTION 5: bio image ---------- */
  .bio-block{
    position:relative;
    margin:44px 20px 0;
    z-index:1;
  }

  /* ---------- footer ---------- */
  .foot{
    text-align:center;
    margin-top:60px;
    font-size:11px;
    letter-spacing:0.18em;
    color:#5c5c56;
    text-transform:uppercase;
  }

  @media (max-width:380px){
    .hero{ padding:60px 20px 32px; }
    .video-block, .checklist-block, .bio-block{ margin-left:14px; margin-right:14px; }
    .cta-wrap{ padding:0 14px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- 1. HEADLINE -->
  <section class="hero">
    <div class="glow"></div>
    <span class="eyebrow">AUREX · LIME COMPANY</span>
    <h1 class="headline">El sistema que no solo <span class="accent">suena bien</span>,<br>sino que realmente <span class="accent">funciona</span>.</h1>
  </section>

  <!-- 2. VIDEO PLACEHOLDER -->
  <div class="video-block">
    <div class="video-frame">
      <div class="play-btn"></div>
    </div>
    <p class="video-caption">▸ Video explicativo (próximamente)</p>
  </div>

  <!-- 3. BOTÓN QUIERO COMENZAR YA -->
  <div class="cta-wrap">
    <button class="cta-btn">Quiero comenzar ya</button>
  </div>

  <!-- 4. TEXTO LLAMADA -->
  <p class="call-note">Antes de dar el paso, tendremos una <b>llamada gratuita de 15 minutos</b> para ver si el sistema encaja contigo.</p>

  <div class="divider"><span></span><div class="dot"></div><span></span></div>

  <!-- 5. IMAGEN "ESTO ES PARA TI SI..." -->
  <div class="checklist-block">
    <div class="img-frame">
      <img src="inciar.png" alt="Esto es para ti si...">
    </div>
  </div>

  <!-- 6. BOTÓN QUIERO AGENDAR MI LLAMADA -->
  <div class="cta-wrap">
    <button class="cta-btn">Quiero agendar mi llamada</button>
  </div>

  <div class="divider"><span></span><div class="dot"></div><span></span></div>

  <!-- 7. IMAGEN "SOY ALE TORRES" -->
  <div class="bio-block">
    <div class="img-frame">
      <img src="yo2.png" alt="Soy Ale Torres">
    </div>
  </div>

  <!-- 8. IMAGEN "ESTO NUNCA SE TRATÓ SOLO DE GANAR MÁS" -->
  <div class="bio-block">
    <div class="img-frame">
      <img src="yo3.png" alt="Esto nunca se trató solo de ganar más">
    </div>
  </div>

  <p class="foot">AUREX · Riqueza en Expansión</p>

</div>

</body>
</html>
